<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QE Consultancy</title>
    <link rel="stylesheet" href="styles.css?v=2.2.32" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand-row">
          <span class="mark" aria-hidden="true">QE</span>
          <div>
            <h1>QE Consultancy</h1>
          </div>
        </div>
      </header>

      <section class="panel panel-copy" aria-labelledby="copyTitle">
        <div class="panel-head">
          <span class="step">1</span>
          <h2 id="copyTitle">Copy &amp; Paste</h2>
        </div>
        <div class="toggle-grid">
          <label class="tile" for="enableBypass">
            <span class="tile-top">
              <span class="tile-title">Copy / Paste</span>
              <span class="switch">
                <input id="enableBypass" type="checkbox" />
                <span class="slider"></span>
              </span>
            </span>
          </label>
          <label class="tile" for="enableCtrlBypass">
            <span class="tile-top">
              <span class="tile-title">Shortcuts</span>
              <span class="switch">
                <input id="enableCtrlBypass" type="checkbox" />
                <span class="slider"></span>
              </span>
            </span>
          </label>
        </div>
      </section>

      <section class="panel panel-manak" aria-labelledby="manakTitle">
        <div class="panel-head">
          <span class="step">2</span>
          <h2 id="manakTitle">Manak Online</h2>
        </div>
        <div class="toggle-grid manak-toggles">
          <label class="tile tile-power tile-import-qr" for="importQrToggle">
            <span class="tile-top">
              <span class="tile-title">Import QR Code</span>
              <span class="switch">
                <input id="importQrToggle" type="checkbox" />
                <span class="slider"></span>
              </span>
            </span>
          </label>
          <label class="tile tile-power" for="powerToggle">
            <span class="tile-top">
              <span class="tile-title">Manak Test Request</span>
              <span class="switch">
                <input id="powerToggle" type="checkbox" />
                <span class="slider"></span>
              </span>
            </span>
          </label>
          <label class="tile tile-new-app" for="newAppToggle">
            <span class="tile-top">
              <span class="tile-title">Submit New Application</span>
              <span class="switch">
                <input id="newAppToggle" type="checkbox" />
                <span class="slider"></span>
              </span>
            </span>
          </label>
          <label class="tile tile-new-app tile-inclusion" for="inclusionToggle">
            <span class="tile-top">
              <span class="tile-title">Submit New Inclusion</span>
              <span class="switch">
                <input id="inclusionToggle" type="checkbox" />
                <span class="slider"></span>
              </span>
            </span>
          </label>
          <!-- Placeholders: the automation for these comes later. -->
          <label class="tile tile-soon" for="renewalToggle" title="Coming soon">
            <span class="tile-top">
              <span class="tile-title">Submit Renewal</span>
              <span class="switch">
                <input id="renewalToggle" type="checkbox" disabled />
                <span class="slider"></span>
              </span>
            </span>
          </label>
          <label class="tile tile-soon" for="orgProfileToggle" title="Coming soon">
            <span class="tile-top">
              <span class="tile-title">Organisation Profile</span>
              <span class="switch">
                <input id="orgProfileToggle" type="checkbox" disabled />
                <span class="slider"></span>
              </span>
            </span>
          </label>
        </div>
        <p id="importQrStatus" class="import-qr-status" aria-live="polite"></p>
        <p id="newAppStatus" class="import-qr-status" aria-live="polite"></p>
        <p id="inclusionStatus" class="import-qr-status" aria-live="polite"></p>
      </section>


      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
