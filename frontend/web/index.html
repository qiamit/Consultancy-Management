<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/qe-logo.png" />
    <link rel="apple-touch-icon" href="/brand/qe-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c416a" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Consultancy Pro" />
    <title>Consultancy Pro</title>
    <script>
      (function () {
        try {
          var key = 'consultancy.appTheme'
          var root = document.documentElement
          // One-time move to the iPhone (iOS) default, 24 Nov 2026: a device still on the old default 'light'
          // (Classic Amber then; iOS Light now) goes to iOS Automatic. Same as migrateToIosDefault() in appTheme.ts.
          if (!localStorage.getItem('consultancy.appTheme.iosDefault')) {
            var old = localStorage.getItem(key)
            if (!old || old === 'light') localStorage.setItem(key, 'system')
            localStorage.setItem('consultancy.appTheme.iosDefault', '1')
          }
          var pref = localStorage.getItem(key) || 'system'
          var builtins = {
            light: 1,
            dark: 1,
            system: 1,
            amber: 1,
            'amber-night': 1,
            ocean: 1,
            forest: 1,
            steel: 1,
            copper: 1,
            teal: 1,
            rose: 1,
          }
          var isCustom = pref.indexOf('custom_') === 0
          if (!builtins[pref] && !isCustom) pref = 'system'
          var resolved = pref
          if (pref === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          root.setAttribute('data-app-theme-pref', pref)
          if (isCustom) {
            root.setAttribute('data-app-theme', 'custom')
            root.setAttribute('data-custom-theme-id', pref)
            try {
              var list = JSON.parse(localStorage.getItem('consultancy.customThemes') || '[]')
              var found = Array.isArray(list)
                ? list.find(function (t) { return t && t.id === pref })
                : null
              if (found && found.mode === 'dark') root.classList.add('dark')
              else root.classList.remove('dark')
            } catch (e2) {
              root.classList.remove('dark')
            }
          } else {
            root.setAttribute('data-app-theme', resolved)
            root.removeAttribute('data-custom-theme-id')
            if (resolved === 'dark' || resolved === 'amber-night') root.classList.add('dark')
            else root.classList.remove('dark')
            if (resolved === 'light' || resolved === 'dark') root.setAttribute('data-ui', 'ios')
            var bar = { light: '#f2f2f7', dark: '#000000', 'amber-night': '#0c0a09' }[resolved]
            var meta = document.querySelector('meta[name="theme-color"]')
            if (bar && meta) meta.setAttribute('content', bar)
          }
        } catch (e) {}
      })()
    </script>
    <!-- APP-O05: system fonts only — no Google Fonts on the critical path -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
