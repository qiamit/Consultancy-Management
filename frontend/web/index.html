<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/qe-logo.png" />
    <link rel="apple-touch-icon" href="/brand/qe-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c416a" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Consultancy Pro" />
    <title>Consultancy Pro — Q Engineering</title>
    <script>
      (function () {
        try {
          var key = 'consultancy.appTheme'
          var pref = localStorage.getItem(key) || 'light'
          var builtins = {
            light: 1,
            dark: 1,
            system: 1,
            ocean: 1,
            forest: 1,
            steel: 1,
            copper: 1,
            teal: 1,
            rose: 1,
          }
          var isCustom = pref.indexOf('custom_') === 0
          if (!builtins[pref] && !isCustom) pref = 'light'
          var resolved = pref
          if (pref === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.documentElement.setAttribute('data-app-theme-pref', pref)
          if (isCustom) {
            document.documentElement.setAttribute('data-app-theme', 'custom')
            document.documentElement.setAttribute('data-custom-theme-id', pref)
            try {
              var list = JSON.parse(localStorage.getItem('consultancy.customThemes') || '[]')
              var found = Array.isArray(list)
                ? list.find(function (t) { return t && t.id === pref })
                : null
              if (found && found.mode === 'dark') document.documentElement.classList.add('dark')
              else document.documentElement.classList.remove('dark')
            } catch (e2) {
              document.documentElement.classList.remove('dark')
            }
          } else {
            document.documentElement.setAttribute('data-app-theme', resolved)
            document.documentElement.removeAttribute('data-custom-theme-id')
            if (resolved === 'dark') document.documentElement.classList.add('dark')
            else document.documentElement.classList.remove('dark')
          }
        } catch (e) {}
      })()
    </script>
    <!-- APP-O05: system fonts only — no Google Fonts on the critical path -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
